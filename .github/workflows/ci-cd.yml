name: Local demo validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      USER_TEST_MONGO: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore User.csproj --locked-mode
      - run: dotnet build User.csproj --no-restore -c Release
      - name: Start isolated Mongo replica set
        run: |
          docker run --detach --name user-test-mongo --publish 127.0.0.1:27017:27017 mongo:8.0 mongod --replSet demo --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec user-test-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec user-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"demo",members:[{_id:0,host:"localhost:27017"}]})'
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec user-test-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Start isolated Blob emulator with fresh test-only credentials
        run: |
          storageKey=$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(64)).decode())')
          echo "::add-mask::$storageKey"
          echo "MUSIC_TEST_STORAGE=DefaultEndpointsProtocol=http;AccountName=usertests;AccountKey=$storageKey;BlobEndpoint=http://127.0.0.1:10000/usertests;" >> "$GITHUB_ENV"
          docker run --detach --name user-test-azurite --publish 127.0.0.1:10000:10000 --env "AZURITE_ACCOUNTS=usertests:$storageKey" mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:10000/usertests; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - run: dotnet restore tests/User.Tests/User.Tests.csproj --locked-mode
      - run: dotnet test tests/User.Tests/User.Tests.csproj -c Release --no-restore
      - name: Remove disposable test dependencies
        if: always()
        run: docker rm --force user-test-mongo user-test-azurite
      - run: python3 scripts/check-advisories.py --self-test
      - run: dotnet list User.csproj package --vulnerable --include-transitive --no-restore --format json > advisory-scan.json
      - run: python3 scripts/check-advisories.py advisory-scan.json User.csproj
      - run: docker build -t spotibuds-user-validation .
